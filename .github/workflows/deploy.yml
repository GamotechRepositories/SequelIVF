name: Deploy Sequel IVF to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sequelivf-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create frontend environment file
        run: |
          if [ -n "$VITE_WEB3FORMS_ACCESS_KEY" ]; then
            printf 'VITE_WEB3FORMS_ACCESS_KEY=%s\n' "$VITE_WEB3FORMS_ACCESS_KEY" > .env.production
          fi
          if [ -n "$VITE_API_URL" ]; then
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL" >> .env.production
          fi
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build website
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          cp -r dist ../dist

      - name: Upload build using SSH key
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/."
          target: "/home1/awjuvemy/public_html/"
          overwrite: true
          strip_components: 1
