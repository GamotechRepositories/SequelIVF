      rel="stylesheet"
    />

  <body>
    <div id="root">
      <!-- Instant Preloader (Pure CSS - No image dependency) -->
      <div id="initial-preloader" style="position: fixed; inset: 0; background: #FAF8FC; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; user-select: none;">
        <div style="position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border: 2.5px solid #F0D5E6; border-top-color: #603085; border-right-color: #C49F64; border-radius: 50%; animation: initSpin 1.1s linear infinite;"></div>
          <div style="position: absolute; inset: 9px; border: 2px solid #F0D5E6; border-bottom-color: #C49F64; border-left-color: #8B5AA8; border-radius: 50%; animation: initSpinRev 0.85s linear infinite;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #603085, #C49F64); box-shadow: 0 0 8px rgba(196,159,100,0.8);"></div>
        </div>
        <div style="margin-top: 14px; width: 56px; height: 3px; background: #F0D5E6; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="position: absolute; inset: 0; background: linear-gradient(90deg, #603085, #C49F64, #603085); border-radius: 9999px; animation: initBar 1.1s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes initSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes initSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes initBar { 0% { transform: translateX(-100%); } 50% { transform: translateX(25%); } 100% { transform: translateX(100%); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
